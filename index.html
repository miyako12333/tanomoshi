*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f4fb;min-height:100vh;color:#222}
.app{max-width:820px;margin:0 auto;padding:1rem}
h1{font-size:18px;font-weight:600;color:#26215C}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px;background:#fff;padding:12px 16px;border-radius:12px;border:0.5px solid #e0dff8}

.month-btn.pm{border-color:#1D9E75;color:#0F6E56}
.month-btn.active{background:#534AB7;color:#fff;border-color:#534AB7}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:1rem}
.stat{background:#fff;border-radius:10px;padding:.65rem .9rem;border:0.5px solid #e0dff8}
.stat-label{font-size:11px;color:#888;margin-bottom:3px}
.stat-value{font-size:20px;font-weight:600;color:#222}

.search-bar{margin-bottom:.65rem}

.tab-bar{display:flex;gap:6px;margin-bottom:1rem;border-bottom:1px solid #e0dff8;padding-bottom:8px}
.tab{padding:6px 16px;font-size:13px;cursor:pointer;border-radius:8px;border:none;background:transparent;color:#888;font-family:inherit}
.tab.active{background:#EEEDFE;color:#534AB7;font-weight:600}
.family-block{margin-bottom:.5rem;background:#fff;border:0.5px solid #e0dff8;border-radius:12px;overflow:hidden}
.family-header{padding:5px 12px;background:#F8F7FE;font-size:11px;font-weight:600;color:#534AB7}
.member-row{display:flex;align-items:center;padding:7px 12px;border-top:0.5px solid #f0effe;gap:6px;flex-wrap:wrap}
.member-name{font-size:13px;font-weight:600;color:#222;min-width:72px;flex-shrink:0}
.months-grid{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.mo-cell{width:25px;height:25px;border-radius:5px;border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;transition:all .15s;flex-shrink:0;background:#fff;color:#aaa;font-family:inherit}
.mo-cell.paid{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56;font-weight:700}
.mo-cell.paid.multi{background:#B5D4F4;border-color:#378ADD;color:#0C447C;font-weight:700}
.mo-cell.future{opacity:.25;cursor:default}
.mo-cell:hover:not(.future){transform:scale(1.12)}
.status-badge{font-size:11px;padding:2px 8px;border-radius:20px;flex-shrink:0;font-weight:600;white-space:nowrap}
.status-badge.complete{background:#E1F5EE;color:#0F6E56}
.status-badge.partial{background:#FAEEDA;color:#854F0B}
.status-badge.none{background:#FCEBEB;color:#A32D2D}
.total-badge{font-size:11px;color:#888;min-width:52px;text-align:right;flex-shrink:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#888;margin-bottom:.65rem}
.legend-item{display:flex;align-items:center;gap:3px}
.legend-dot{width:13px;height:13px;border-radius:3px}
.save-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}

.sync-status{font-size:12px}

.sync-status.err{color:#A32D2D}
.dl-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.dl-btn:hover{background:#3C3489}
.gas-panel{background:#fff;border:0.5px solid #e0dff8;border-radius:12px;padding:1rem;margin-bottom:1rem}

.gas-save-btn{padding:5px 14px;background:#534AB7;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}

.rp-total-label{font-size:12px;color:#666}
.rp-total-value{font-size:20px;font-weight:700;color:#534AB7}

  {family:'個人',name:'りむ',payments:[1000,1000,1000,1000,0,0,0,0,0,0,0,0]},
];

let rawData;
function loadData(){
  const saved=localStorage.getItem('tanomoshi_data');
  const savedCount=localStorage.getItem('tanomoshi_collected');
  if(saved){try{rawData=JSON.parse(saved);if(savedCount)collectedCount=parseInt(savedCount);}catch(e){rawData=JSON.parse(JSON.stringify(defaultData));}}
  else{rawData=JSON.parse(JSON.stringify(defaultData));}
  if(gasUrl&&document.getElementById('gasUrlInput'))document.getElementById('gasUrlInput').value=gasUrl;
  if(gasUrl){setSyncStatus('クラウドから読み込み中...','');loadFromGAS();}
  else{setSyncStatus('ローカルデータを読み込みました','ok');}
}

function loadFromGAS(){
  if(!gasUrl)return;
  fetch(gasUrl)
    .then(r=>r.json())
    .then(obj=>{
      if(obj.status==='ok'&&obj.data){
        rawData=obj.data;
        collectedCount=obj.collectedCount||collectedCount;
        localStorage.setItem('tanomoshi_data',JSON.stringify(rawData));
        localStorage.setItem('tanomoshi_collected',String(collectedCount));
        renderAll();
        setSyncStatus('クラウドから読み込み完了','ok');
      }else if(obj.status==='empty'){
        setSyncStatus('クラウドにデータなし（ローカル使用中）','ok');
      }else{
        setSyncStatus('ローカルデータを使用中','ok');
      }
    })
    .catch(()=>{setSyncStatus('ローカルデータを使用中','ok');});
}

function setSyncStatus(msg,cls){
  const el=document.getElementById('syncStatus');
  if(el){el.textContent=msg;el.className='sync-status '+(cls||'');}
}

function saveData(){
  localStorage.setItem('tanomoshi_data',JSON.stringify(rawData));
  localStorage.setItem('tanomoshi_collected',String(collectedCount));
  const now=new Date();
  const ts=(now.getMonth()+1)+'/'+ now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  setSyncStatus('保存済み '+ts,'ok');
  if(gasUrl){
    fetch(gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',collectedCount,data:rawData})})
    .then(()=>setSyncStatus('クラウド保存完了 '+ts,'ok'))
    .catch(()=>setSyncStatus('ローカル保存済み（クラウド失敗）','err'));
  }
}

function saveGasUrl(){
  gasUrl=document.getElementById('gasUrlInput').value.trim();
  localStorage.setItem('tanomoshi_gas_url',gasUrl);
  document.getElementById('gasStatus').textContent=gasUrl?'URLを保存しました':'URLをクリアしました';
}

function exportJSON(){
  const obj={collectedCount,data:rawData,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download='tanomoshi_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  a.click();
}

function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);rawData=obj.data;if(obj.collectedCount)collectedCount=obj.collectedCount;saveData();renderAll();alert('インポート完了しました');}catch(err){alert('ファイルの読み込みに失敗しました');}};
  reader.readAsText(file);
}

function getTotalPaid(m){return m.payments.reduce((a,b)=>a+b,0);}
function getStatus(m){
  const t=getTotalPaid(m),r=collectedCount*1000;
  if(t===0)return 'none';
  return t>=r?'complete':'partial';
}
function getStatusLabel(m){
  const st=getStatus(m),t=getTotalPaid(m);
  if(st==='none')return{label:'未納',cls:'none'};
  if(st==='complete'){const ex=t-collectedCount*1000;return ex>0?{label:'完納(+'+ex.toLocaleString()+')',cls:'complete'}:{label:'完納 ✓',cls:'complete'};}
  return{label:Math.floor(t/1000)+'/'+collectedCount+'ヶ月',cls:'partial'};
}

function renderCollectedButtons(){
  const el=document.getElementById('collectedMonths');el.innerHTML='';
  for(let i=1;i<=12;i++){
    const b=document.createElement('button');
    b.className='month-btn'+(i<=collectedCount?' pm':'')+(i===collectedCount?' active':'');
    b.textContent=i+'月';b.onclick=()=>{collectedCount=i;renderAll();};
    el.appendChild(b);
  }
}

function renderStats(){
  const total=rawData.reduce((s,m)=>s+getTotalPaid(m),0);
  const complete=rawData.filter(m=>getStatus(m)==='complete').length;
  const none=rawData.filter(m=>getStatus(m)==='none').length;
  const partial=rawData.length-complete-none;
  const monthly=Array(12).fill(0);
  rawData.forEach(m=>m.payments.forEach((v,i)=>monthly[i]+=v));
  document.getElementById('statsArea').innerHTML=`
    <div class="stat"><div class="stat-label">総納入額</div><div class="stat-value">¥${total.toLocaleString()}</div></div>
    <div class="stat"><div class="stat-label">${collectedCount}月 受取額</div><div class="stat-value">¥${monthly[collectedCount-1].toLocaleString()}</div></div>
    <div class="stat"><div class="stat-label">完納</div><div class="stat-value green">${complete}名</div></div>
    <div class="stat"><div class="stat-label">一部納入</div><div class="stat-value amber">${partial}名</div></div>
    <div class="stat"><div class="stat-label">未納</div><div class="stat-value red">${none}名</div></div>`;
}

function renderList(q=''){
  const families={};
  rawData.forEach(m=>{if(q&&!m.name.includes(q)&&!m.family.includes(q))return;if(!families[m.family])families[m.family]=[];families[m.family].push(m);});
  const el=document.getElementById('memberList');el.innerHTML='';
  Object.entries(families).forEach(([fam,members])=>{
    const block=document.createElement('div');block.className='family-block';
    block.innerHTML=`<div class="family-header">&#127968; ${fam}</div>`;
    members.forEach(m=>{
      const row=document.createElement('div');row.className='member-row';
      const st=getStatusLabel(m);let cells='';
      for(let i=0;i<12;i++){
        const v=m.payments[i],fut=i>=collectedCount,multi=v>1000;
        let cls='mo-cell'+(v>0?(multi?' paid multi':' paid'):'')+(fut?' future':'');
        const lbl=v>0?(multi?(v/1000)+'k':'✓'):(i+1);
        cells+=`<div class="${cls}" title="${i+1}月: ¥${v.toLocaleString()}" onclick="togglePayment('${m.name}',${i})" oncontextmenu="resetPayment('${m.name}',${i},event)" ontouchstart="startLongPress('${m.name}',${i})" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()">${lbl}</div>`;
      }
      row.innerHTML=`<span class="member-name">${m.name}</span><div class="months-grid">${cells}</div><span class="total-badge">¥${getTotalPaid(m).toLocaleString()}</span><span class="status-badge ${st.cls}">${st.label}</span>`;
      block.appendChild(row);
    });
    el.appendChild(block);
  });
}

function togglePayment(name,idx){
  if(idx>=collectedCount)return;
  const m=rawData.find(x=>x.name===name);if(!m)return;
  // 1回押すごとに +1000円、上限10000円で0に戻る
  const cur=m.payments[idx];
  m.payments[idx]=cur>=10000?0:cur+1000;
  setSyncStatus('未保存の変更があります','err');
  renderAll();
}
function resetPayment(name,idx,e){
  e.preventDefault();
  if(idx>=collectedCount)return;
  const m=rawData.find(x=>x.name===name);if(!m)return;
  m.payments[idx]=0;
  setSyncStatus('未保存の変更があります','err');
  renderAll();
}

function buildReportHTML(){
  const monthly=Array(12).fill(0),mCount=Array(12).fill(0);
  rawData.forEach(m=>m.payments.forEach((v,i)=>{if(v>0){monthly[i]+=v;mCount[i]++;}}));
  const total=rawData.reduce((s,m)=>s+getTotalPaid(m),0);
  const complete=rawData.filter(m=>getStatus(m)==='complete');
  const partial=rawData.filter(m=>getStatus(m)==='partial');
  const none=rawData.filter(m=>getStatus(m)==='none');
  const now=new Date();
  const dateStr=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 作成';

  // 月別カード
  let monthCards='';
  for(let i=0;i<collectedCount;i++){
    monthCards+=`<div class="rp-month-card"><div class="mo-name">${i+1}月</div><div class="mo-amt">¥${monthly[i].toLocaleString()}</div><div class="mo-cnt">${mCount[i]}名</div></div>`;
  }

  // ステータスピル
  function pills(arr,cls){
    return arr.map(m=>{
      const t=getTotalPaid(m),mo=collectedCount;
      const sub=cls==='complete'?(t>mo*1000?'+¥'+(t-mo*1000).toLocaleString():mo+'月完納'):(cls==='partial'?Math.floor(t/1000)+'/'+mo+'ヶ月':'0円');
      return `<span class="rp-pill ${cls}"><span class="rp-pill-dot"></span>${m.name}<span class="rp-pill-sub">${sub}</span></span>`;
    }).join('');
  }

  // 月別詳細表 ヘッダー
  let thCols='';
  for(let i=0;i<collectedCount;i++) thCols+=`<th>${i+1}月</th>`;
  thCols+=`<th>合計</th><th>状況</th>`;

  // 家族ごとにまとめて行生成
  const families={};
  rawData.forEach(m=>{if(!families[m.family])families[m.family]=[];families[m.family].push(m);});
  let tableRows='';
  Object.entries(families).forEach(([fam,members])=>{
    // 家族行
    tableRows+=`<tr class="fam-row"><td class="fam-td" colspan="${collectedCount+3}">${fam}</td></tr>`;
    members.forEach(m=>{
      const st=getStatus(m);
      const t=getTotalPaid(m);
      let tds='';
      for(let i=0;i<collectedCount;i++){
        const v=m.payments[i];
        if(v===0) tds+=`<td><span class="cell-none">-</span></td>`;
        else if(v===1000) tds+=`<td><span class="cell-paid">✓</span></td>`;
        else tds+=`<td><span class="cell-multi">${v/1000}k</span></td>`;
      }
      const stLabel=st==='complete'?`<span class="td-status-c">完納✓</span>`:st==='partial'?`<span class="td-status-p">${Math.floor(t/1000)}/${collectedCount}月</span>`:`<span class="td-status-n">未納</span>`;
      const rowBg=st==='complete'?'background:#f0fdf8':st==='none'?'background:#fff5f5':'';
      tableRows+=`<tr style="${rowBg}"><td class="name-td">${m.name}</td>${tds}<td class="td-total">¥${t.toLocaleString()}</td><td>${stLabel}</td></tr>`;
    });
  });

  // 月合計行
  let footTds='';
  for(let i=0;i<collectedCount;i++) footTds+=`<td style="font-weight:700;font-size:10px;color:#534AB7;background:#F8F7FE">¥${(monthly[i]/1000).toFixed(0)}k</td>`;
  footTds+=`<td style="font-weight:700;font-size:10px;color:#534AB7;background:#F8F7FE">¥${total.toLocaleString()}</td><td style="background:#F8F7FE"></td>`;

  return `
  <div class="rp-head">
    <div class="rp-head-title">たのもし 納入状況報告　${collectedCount}月末時点</div>
    <div class="rp-head-sub">東京担当 宮下寛子 ／ ${dateStr}</div>
  </div>
  <div class="rp-body">
    <div class="rp-section">
      <div class="rp-section-title">月別受取額</div>
      <div class="rp-monthly-grid">${monthCards}</div>
      <div class="rp-total-row"><span class="rp-total-label">累計合計</span><span class="rp-total-value">¥${total.toLocaleString()}</span></div>
    </div>
    <div class="rp-section">
      <div class="rp-section-title">完納（${complete.length}名）</div>
      <div class="rp-member-pills">${pills(complete,'complete')}</div>
    </div>
    <div class="rp-section">
      <div class="rp-section-title">一部納入（${partial.length}名）</div>
      <div class="rp-member-pills">${pills(partial,'partial')}</div>
    </div>
    ${none.length?`<div class="rp-section"><div class="rp-section-title">未納（${none.length}名）</div><div class="rp-member-pills">${pills(none,'none')}</div></div>`:''}
    <div class="rp-section">
      <div class="rp-section-title">全員の月別納入明細</div>
      <div class="rp-table-wrap">
        <table class="rp-table">
          <thead><tr><th class="name-col">名前</th>${thCols}</tr></thead>
          <tbody>${tableRows}</tbody>
          <tfoot><tr><td class="name-td" style="background:#F8F7FE;font-weight:700;color:#534AB7">月別合計</td>${footTds}</tr></tfoot>
        </table>
      </div>
    </div>
  </div>
  <div class="rp-footer">たのもし東京グループ　集金担当：宮下寛子</div>`;
}

function renderReport(){
  document.getElementById('reportPreview').innerHTML=buildReportHTML();
}

async function downloadReport(){
  const el=document.getElementById('reportPreview');
  const btn=document.querySelector('.dl-btn');
  btn.textContent='生成中...';btn.disabled=true;
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:800});
    const a=document.createElement('a');
    const d=new Date();
    a.download='たのもし報告_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.png';
    a.href=canvas.toDataURL('image/png');a.click();
  }catch(e){alert('画像生成に失敗しました');}
  btn.innerHTML='&#128247; 画像でダウンロード';btn.disabled=false;
}

function switchTab(tab){
  ['members','report','settings'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'block':'none';});
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['members','report','settings'][i]===tab));
  if(tab==='report')renderReport();
  if(tab==='settings'&&gasUrl)document.getElementById('gasUrlInput').value=gasUrl;
}

function renderAll(){
  renderCollectedButtons();
  renderStats();
  renderList(document.getElementById('searchInput')?.value||'');
}

// 長押しリセット用タイマー
let longPressTimer=null;
function startLongPress(name,idx){
  longPressTimer=setTimeout(()=>{
    const m=rawData.find(x=>x.name===name);if(!m)return;
    m.payments[idx]=0;
    setSyncStatus("未保存の変更があります","err");
    renderAll();
  },600);
}
function cancelLongPress(){clearTimeout(longPressTimer);}

loadData();
renderAll();
</script>
</body>
</html>
